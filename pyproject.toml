[project]
name = "ollama-ct"
version = "0.1.0"
description = "FastAPI service that streams chat responses from a local Ollama model"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2",
    "pydantic-settings>=2",
    "httpx",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
]
